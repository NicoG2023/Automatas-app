[project]
name = "app-automatas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolás Guevara Herrán", email = "nguevarah@udistrital.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
app-automatas = "app_automatas:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
